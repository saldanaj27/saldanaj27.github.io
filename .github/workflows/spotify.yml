name: Refresh Spotify

# Fetches top artists and commits the result if it changed. The commit to main
# triggers the normal build-and-deploy workflow, so the footer updates without
# any runtime dependency on Spotify.
on:
  schedule:
    # Twice a day. The data is a four-week rolling window, so it barely moves;
    # more frequent runs would only add commit noise.
    - cron: '0 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch top artists
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/fetch-spotify.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/spotify.json; then
            echo "no change to spotify data"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/spotify.json
          git commit -m "chore: refresh Spotify top artists"
          git push
